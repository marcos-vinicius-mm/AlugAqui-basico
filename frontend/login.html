<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAqui - Entrar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="style/paginas.css" rel="stylesheet">
  <link href="style/componentes.css" rel="stylesheet">
  <link href="style/login.css" rel="stylesheet">
</head>
<body>

  <header class="topo">
    <div id="logo">
      <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
      <h2>Entre na sua conta</h2>
      <p>Acesse para anunciar, favoritar e comentar</p>
    </div>
  </header>

  <main class="container">

    <form id="form-login" novalidate>

      <label class="campo-login">
        E-mail
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="username" required>
      </label>

      <label class="campo-login">
        Senha
        <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
      </label>

      <p id="msg-erro" class="msg-erro" role="alert" hidden></p>

      <div class="acoes">
        <button type="submit">Entrar</button>
      </div>

      <p class="link-extra">
        Não tem conta? <a href="cadastro.html">Cadastre-se</a> ·
        <a href="index.html">Voltar ao site</a>
      </p>

      <!-- Somente para testes -->
      <div class="dica-teste">
        <strong>Contas de teste</strong>
        <p>Usuário comum: <code>usuario@teste.com</code> / <code>123456</code></p>
        <p>Administrador: <code>admin@teste.com</code> / <code>admin123</code></p>
      </div>
    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
