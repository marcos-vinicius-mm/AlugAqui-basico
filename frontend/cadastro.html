<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAqui - Criar conta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="style/paginas.css" rel="stylesheet">
  <link href="style/componentes.css" rel="stylesheet">
  <link href="style/login.css" rel="stylesheet">
  <link href="style/cadastro.css" rel="stylesheet">
</head>
<body>

  <header class="topo">
    <div id="logo">
      <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
      <h2>Crie sua conta</h2>
      <p>Anuncie imóveis, favorite e comente</p>
    </div>
  </header>

  <main class="container">

    <form id="form-cadastro" novalidate>

      <label class="campo-login">
        Nome de usuário
        <input type="text" id="username" name="username" placeholder="ex.: maria.silva" autocomplete="username" minlength="3" maxlength="30" required>
        <small class="dica-campo">Mínimo 3 caracteres: letras, números, ponto, hífen ou sublinhado.</small>
      </label>

      <label class="campo-login">
        E-mail
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
      </label>

      <label class="campo-login">
        <span>Telefone <span class="opcional">(opcional)</span></span>
        <input type="tel" id="telefone" name="telefone" placeholder="(88) 99999-9999" autocomplete="tel" inputmode="numeric">
        <small class="dica-campo">Aparece para quem quiser falar com você sobre um anúncio.</small>
      </label>

      <label class="campo-login">
        Senha
        <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required>
      </label>

      <label class="campo-login">
        Confirmar senha
        <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" autocomplete="new-password" required>
      </label>

      <label class="mostrar-senha">
        <input type="checkbox" id="mostrar-senha"> Mostrar senhas
      </label>

      <p id="msg-erro" class="msg-erro" role="alert" hidden></p>
      <p id="msg-sucesso" class="msg-sucesso" role="status" hidden></p>

      <div class="acoes">
        <button type="submit" id="btn-cadastrar">Criar conta</button>
      </div>

      <p class="link-extra">
        Já tem conta? <a href="login.html">Entrar</a> ·
        <a href="index.html">Voltar ao site</a>
      </p>
    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
