<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlugAqui - Aluguel de Imóveis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="style/Paginas.css" rel="stylesheet">
    <link href="style/Componentes.css" rel="stylesheet">

</head>
<body>

    <header class="topo">
        <div id="logo">
            <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
            <h2> Encontre seu lugar ideal <br> para morar</h2>
            <p>Busque casas, apartamentos e muito mais</p>
        </div>
        
       <!-- <div id="usuario-deslogado"> 
                <a href="login.html" id="login">Entrar</a>
                <a href="cadastro.html" id="cadastrar">Cadastrar-se</a>
        </div> -->

    </header>

    <nav class="navbar" data-bs-theme="dark">
        <button class="btn-menu navbar-toggler" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#menuLateral"
                aria-controls="menuLateral" aria-label="Abrir menu">
            <i class="bi bi-list"></i>
        </button>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuLateralLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Link</a></li>
            </ul>
        </div>
    </div>

    <main class="container">

        <form id="form-busca">

            <label class="campo_busca">
                Busca:
            <input type="search" name="busca" placeholder="Buscar por título, descrição ou bairro">
            </label>


            <div class="filtros">

                <label class="campo_filtro">
                    Valor Minimo
                    <input type="number" name="valor_min" placeholder="Preço mín." min="0">
                </label>
                
                
                <label class="campo_filtro">
                    Tipo de imóvel
                    <select name="tipo">
                        <option value="">Todos</option>
                        <option value="casa">Casa</option>
                        <option value="apartamento">Apartamento</option>
                        <option value="kitnet">Kitnet</option>
                        <option value="comercial">Comercial</option>
                    </select>
                </label>

                <label class="campo_filtro">
                    Quartos
                    <select name="quartos">
                        <option value="">Qualquer n° de quartos</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                    </select>
                </label>

                <label class="campo_filtro">
                    Banheiros
                    <select name="banheiros">
                        <option value="">Qualquer n° de banheiros</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                    </select>
                </label>
                
                <label class="campo_filtro">
                    Ordem
                    <select name="ordem">
                        <option value="recentes">Mais recentes</option>
                        <option value="menor_preco">Menor preço</option>
                        <option value="maior_preco">Maior preço</option>
                    </select>
                </label>

                <div class="campo_filtro" id="opcoes">
                    <label>
                        <input type="checkbox" name="aceita_pets"> Aceita pets
                    </label>

                    <label>
                        <input type="checkbox" name="mobiliado"> Mobiliado
                    </label>
                </div>
            
            </div>

            <div class="acoes">
                <button type="submit">Buscar</button>
                <button type="reset">Limpar</button>
            </div>
        </form>
    </main>

    <section id="anuncios" class="lista-anuncios"></section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
